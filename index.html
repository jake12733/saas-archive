<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS</title>
  <meta name="description" content="SaaS 프로젝트와 기획서 정리" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --subtle: #f4f4f5;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --accent: #111827;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-count {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-subtle {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .link-subtle:hover { color: var(--text); background: var(--subtle); }

    /* Buttons */
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn:hover { background: var(--subtle); border-color: var(--border-strong); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover { background: #27272a; border-color: #27272a; }

    .btn-danger {
      color: #dc2626;
      border-color: #fecaca;
      background: #fff;
    }

    .btn-danger:hover { background: #fef2f2; }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 22px 0 24px;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s;
    }

    .chip:hover { color: var(--text); border-color: var(--border-strong); }

    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .search {
      width: 230px;
      max-width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 13px;
      font-family: inherit;
    }

    .search:focus, .field:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s;
    }

    .card:hover { border-color: #9ca3af; }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .type-tag {
      font-size: 11.5px;
      font-weight: 600;
      color: #374151;
      background: var(--subtle);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      display: inline-block;
    }

    .dot-기획중 { background: #9ca3af; }
    .dot-개발중 { background: #f59e0b; }
    .dot-배포완료 { background: #10b981; }

    .card-title {
      margin: 2px 0 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .card-desc {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 40px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }

    .tag {
      font-size: 11.5px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-links {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
    }

    .card-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }

    .card-link:hover { color: var(--text); text-decoration: underline; }

    .card-link-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    .card-link-btn:hover { text-decoration: underline; }

    .card-edit-btn {
      background: none;
      border: none;
      padding: 2px 4px;
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }

    .card-edit-btn:hover { color: var(--text); }

    .empty {
      text-align: center;
      padding: 64px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* Modal */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal {
      width: 100%;
      max-width: 720px;
      max-height: 88vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.14);
    }

    .modal-sm { max-width: 520px; }

    .modal-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .modal-head-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg);
    }

    /* PRD Reader */
    .prd-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      padding: 12px 14px;
      background: var(--subtle);
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .prd-meta b { color: var(--text); font-weight: 600; }

    .prd-section {
      margin-bottom: 18px;
    }

    .prd-section:last-child { margin-bottom: 0; }

    .prd-section h3 {
      margin: 0 0 6px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
    }

    .prd-section p {
      margin: 4px 0;
      font-size: 13.5px;
      color: #374151;
      line-height: 1.65;
    }

    .prd-section ul {
      margin: 4px 0;
      padding-left: 18px;
      font-size: 13.5px;
      color: #374151;
      line-height: 1.65;
    }

    .prd-section li { margin: 2px 0; }

    .prd-section code {
      background: var(--subtle);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12.5px;
      font-family: Consolas, Monaco, monospace;
    }

    /* Form */
    .form-stack { display: flex; flex-direction: column; gap: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: #374151; }
    .field {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 13.5px;
      font-family: inherit;
      line-height: 1.5;
    }

    textarea.field { resize: vertical; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      z-index: 100;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 580px) {
      .grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .search { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1>SaaS</h1>
        <span class="brand-count" id="totalCount"></span>
      </div>
      <div class="header-actions">
        <a href="https://github.com/jake12733/saas-archive" target="_blank" rel="noopener" class="link-subtle">GitHub</a>
        <a href="https://jake12733.github.io/acharive/" target="_blank" rel="noopener" class="link-subtle">Archive</a>
        <button type="button" class="btn btn-primary" id="btnAdd">+ 추가</button>
      </div>
    </header>

    <!-- Filter & Search -->
    <section class="toolbar" aria-label="필터 및 검색">
      <div class="filters" id="typeFilters"></div>
      <input type="search" id="searchInput" class="search" placeholder="검색 (이름, 스택, 기획서)" />
    </section>

    <!-- Project Cards -->
    <main>
      <div class="grid" id="grid"></div>
      <div class="empty hidden" id="empty">등록된 SaaS 프로젝트가 없습니다.</div>
    </main>
  </div>

  <!-- PRD Modal -->
  <div class="backdrop hidden" id="prdModal" role="dialog" aria-modal="true" aria-labelledby="prdTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="prdTitle">기획서</h2>
        <div class="modal-head-actions">
          <button type="button" class="btn" id="btnTogglePrdMode">수정</button>
          <button type="button" class="btn" id="btnDownloadMd">.md 저장</button>
          <button type="button" class="btn" id="btnClosePrd">닫기</button>
        </div>
      </div>

      <div class="modal-body">
        <!-- Read View -->
        <div id="prdReadView"></div>

        <!-- Edit View -->
        <div id="prdEditView" class="form-stack hidden">
          <div>
            <label class="label" for="eProblem">1. 문제 정의 &amp; 타깃</label>
            <textarea id="eProblem" rows="3" class="field" placeholder="- 누구의 어떤 문제를 해결하는가?"></textarea>
          </div>
          <div>
            <label class="label" for="eFeatures">2. 핵심 기능 &amp; 흐름 (MVP)</label>
            <textarea id="eFeatures" rows="4" class="field" placeholder="- 핵심 기능과 사용자 흐름"></textarea>
          </div>
          <div>
            <label class="label" for="eBusiness">3. 수익 모델 &amp; SaaS 구조</label>
            <textarea id="eBusiness" rows="3" class="field" placeholder="- 플랜/과금, 멀티테넌시, 권한, 사용량 제한"></textarea>
          </div>
          <div>
            <label class="label" for="eArchitecture">4. 아키텍처 &amp; 기술 선택 이유</label>
            <textarea id="eArchitecture" rows="4" class="field" placeholder="- 주요 테이블, API 흐름, 왜 이 기술을 선택했는지(트레이드오프)"></textarea>
          </div>
          <div>
            <label class="label" for="eNotes">5. 트러블슈팅 &amp; 핵심 설명 포인트</label>
            <textarea id="eNotes" rows="4" class="field" placeholder="- 겪었던 문제 → 해결, 3분 설명 핵심 포인트"></textarea>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <div style="display:flex; gap:8px; align-items:center;">
          <a id="prdGithubLink" href="#" target="_blank" rel="noopener" class="card-link hidden">GitHub .md ↗</a>
          <button type="button" class="btn hidden" id="btnImportMd">.md 불러오기</button>
          <input type="file" id="mdInput" accept=".md,.txt" hidden />
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-primary hidden" id="btnSavePrd">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Project Modal -->
  <div class="backdrop hidden" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <form class="modal modal-sm" id="projectForm" novalidate>
      <div class="modal-head">
        <h2 id="editTitle">SaaS 추가</h2>
        <button type="button" class="btn" id="btnCloseEdit">닫기</button>
      </div>

      <div class="modal-body form-stack">
        <input type="hidden" name="id" />

        <div>
          <label class="label" for="fTitle">프로젝트명 *</label>
          <input id="fTitle" name="title" class="field" required placeholder="예) AI 마케팅 콘텐츠 자동화" />
        </div>

        <div class="form-row">
          <div>
            <label class="label" for="fType">SaaS 유형</label>
            <select id="fType" name="type" class="field"></select>
          </div>
          <div>
            <label class="label" for="fStatus">상태</label>
            <select id="fStatus" name="status" class="field">
              <option value="기획중">기획중</option>
              <option value="개발중">개발중</option>
              <option value="배포완료">배포완료</option>
            </select>
          </div>
        </div>

        <div>
          <label class="label" for="fDesc">한 줄 설명 *</label>
          <textarea id="fDesc" name="desc" rows="2" class="field" required placeholder="무엇을 해결하는 서비스인지 한 문장으로 작성"></textarea>
        </div>

        <div class="form-row">
          <div>
            <label class="label" for="fTarget">타깃 고객</label>
            <input id="fTarget" name="target" class="field" placeholder="예) 1인 마케터" />
          </div>
          <div>
            <label class="label" for="fPricing">수익 모델</label>
            <input id="fPricing" name="pricing" class="field" placeholder="예) 월 구독 / 크레딧" />
          </div>
        </div>

        <div>
          <label class="label" for="fTags">기술 스택 (쉼표 구분)</label>
          <input id="fTags" name="tags" class="field" placeholder="Next.js, TypeScript, Supabase" />
        </div>

        <div class="form-row">
          <div>
            <label class="label" for="fLive">데모 URL</label>
            <input id="fLive" name="live" type="url" class="field" placeholder="https://..." />
          </div>
          <div>
            <label class="label" for="fRepo">GitHub URL</label>
            <input id="fRepo" name="repo" type="url" class="field" placeholder="https://github.com/..." />
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn btn-danger hidden" id="btnDelete">삭제</button>
        <div style="display:flex; gap:8px; margin-left:auto;">
          <button type="button" class="btn" id="btnCancelEdit">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </div>
    </form>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script>
    const STORAGE_KEY = 'saas_archive_clean_v1';
    const TYPES = ['Micro-SaaS', 'B2B', 'B2C', 'B2B2C', 'AI-native', 'API-first', 'Vertical'];

    const DEFAULT_PROJECTS = [
      {
        id: 'saas-01',

        type: 'Micro-SaaS',

          business: '- 무료: 월 10 크레딧 / Pro: 월 300 크레딧 + 노션 연동\n- 생성 호출 전 트랜잭션으로 크레딧 검증·차감, 실패 시 자동 환불',

        }
      },
      {
        id: 'saas-02',
        title: 'B2B 리드·CS 자동화(AX) 워크스페이스',
        type: 'B2B',
        status: '기획중',
        desc: '고객 문의를 웹훅으로 수집해 AI가 분류·요약·답변 초안을 만들고 슬랙으로 알림을 보내는 팀용 대시보드.',
        target: '소규모 B2B 팀 · AX 에이전시',
        pricing: '좌석(Seat) + 월 실행 건수',
        tags: ['Next.js', 'PostgreSQL', 'Prisma', 'Webhook'],
        live: '',
        repo: '',
        planUrl: 'https://github.com/jake12733/saas-archive/blob/main/plans/02-b2b-ax-workspace.md',
        prd: {
          problem: '- 매일 들어오는 견적·제휴·CS 문의를 수동 분류하느라 리드 응답 속도가 늦어짐.\n- 담당자별 처리 이력이 남지 않아 영업 기회가 누락됨.',
          features: '- 워크스페이스별 전용 Webhook URL 및 문의 폼 발급\n- 문의 접수 시 AI 카테고리/긴급도 분류 + 답변 초안 생성\n- 슬랙 알림 발송 및 자동화 실행 로그(성공/실패/재시도) 확인',
          business: '- 멀티테넌시: 모든 테이블에 `workspace_id` 기반 데이터 격리\n- 권한(RBAC): Owner(결제/멤버), Admin(규칙 설정), Member(문의 처리)',
          architecture: '- 테이블: `workspaces`, `memberships`, `inbound_tickets`, `automation_rules`, `execution_logs`\n- 흐름: Webhook 수신 → 즉시 202 응답 & 저장 → 비동기 워커가 LLM·Slack 처리\n- [선택] DB 분리 대신 `workspace_id` 컬럼 방식: 초기 운영비·마이그레이션 복잡도 절감',
          notes: '- 핵심 설명 포인트: 멀티테넌시 접근 제어, 비동기 웹훅 처리, 외부 API 실패 시 재시도/로그 설계'
        }
      },
      {
        id: 'saas-03',
        title: 'RAG AI 튜터 미니 구독형 클래스 플랫폼',
        type: 'B2B2C',
        status: '기획중',
        desc: '강사가 강의 자료를 올리면 수강생이 구독 후 학습하고, 강의 근거 기반 AI 튜터에게 질문하는 교육 SaaS.',
        target: '온라인 강사 · 수강생',
        pricing: '수강생 월 구독',
        tags: ['Next.js', 'pgvector', 'RAG', 'Stripe/Toss'],
        live: '',
        repo: '',
        planUrl: 'https://github.com/jake12733/saas-archive/blob/main/plans/03-rag-class-platform.md',
        prd: {
          problem: '- 수강생이 실습 중 막혀도 강사 답변을 기다리다 중도 포기함.\n- 일반 AI는 강의 커리큘럼과 다른 답변(할루시네이션)을 제공함.',
          features: '- 강사 자료(PDF/텍스트) 업로드 시 자동 청킹·벡터 임베딩\n- 강의 자료 출처(섹션)를 함께 표시하는 RAG AI 튜터 챗봇\n- 구독 결제(테스트 모드) 및 웹훅 기반 수강 권한 자동 동기화',
          business: '- 무료: 1강 미리보기 + AI 질문 5회\n- 구독: 전체 강의 + AI 튜터(Rate Limit 적용)',
          architecture: '- 테이블: `courses`, `lessons`, `document_chunks`, `subscriptions`, `chat_messages`\n- [선택] 별도 벡터 DB 대신 PostgreSQL + `pgvector`: 수강 권한과 벡터 검색을 한 쿼리로 묶어 미구독 자료 유출 차단',
          notes: '- 핵심 설명 포인트: 결제 웹훅 멱등성 처리, 권한 필터링이 결합된 RAG 검색 구조'
        }
      }
    ];

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    let projects = [];
    let selectedType = '전체';
    let activePrdId = null;
    let isEditingPrd = false;
    let toastTimer = null;

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) { projects = parsed; return; }
        }
      } catch {}
      projects = structuredClone(DEFAULT_PROJECTS);
      save();
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); } catch {}
    }

    function showToast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2000);
    }

    function renderFilters() {
      const list = ['전체', ...TYPES];
      $('typeFilters').innerHTML = list.map(t => {
        const count = t === '전체' ? projects.length : projects.filter(p => p.type === t).length;
        const active = selectedType === t ? 'active' : '';
        return `<button type="button" class="chip ${active}" data-type="${t}">${t}${count ? ` ${count}` : ''}</button>`;
      }).join('');
    }

    function renderGrid() {
      const q = $('searchInput').value.trim().toLowerCase();
      const filtered = projects.filter(p => {
        if (selectedType !== '전체' && p.type !== selectedType) return false;
        if (q) {
          const hay = [p.title, p.type, p.status, p.desc, p.target, p.pricing, ...(p.tags || []), ...Object.values(p.prd || {})].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      $('totalCount').textContent = `${projects.length}개`;

      if (!filtered.length) {
        $('grid').innerHTML = '';
        $('empty').classList.remove('hidden');
        return;
      }

      $('empty').classList.add('hidden');
      $('grid').innerHTML = filtered.map(p => `
        <article class="card">
          <div class="card-meta">
            <span class="type-tag">${esc(p.type)}</span>
            <span class="status"><span class="dot dot-${esc(p.status)}"></span>${esc(p.status)}</span>
          </div>
          <h2 class="card-title">${esc(p.title)}</h2>
          <p class="card-desc">${esc(p.desc)}</p>
          <div class="tags">
            ${(p.tags || []).slice(0, 4).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
          </div>
          <div class="card-footer">
            <div class="card-links">
              <button type="button" class="card-link-btn" data-open-prd="${esc(p.id)}">기획서</button>
              ${p.live ? `<a class="card-link" href="${esc(p.live)}" target="_blank" rel="noopener">데모 ↗</a>` : ''}
              ${p.repo ? `<a class="card-link" href="${esc(p.repo)}" target="_blank" rel="noopener">GitHub ↗</a>` : ''}
            </div>
            <button type="button" class="card-edit-btn" data-edit="${esc(p.id)}">수정</button>
          </div>
        </article>
      `).join('');
    }

    function render() {
      renderFilters();
      renderGrid();
    }

    /* PRD Modal */
    function formatText(text) {
      const raw = (text || '').trim();
      if (!raw) return '<p style="color:#9ca3af;">미작성</p>';
      const lines = esc(raw).split(/\r?\n/);
      const inline = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      let out = '', inList = false;
      for (const l of lines) {
        const t = l.trim();
        if (!t) { if (inList) { out += '</ul>'; inList = false; } continue; }
        if (t.startsWith('- ')) {
          if (!inList) { out += '<ul>'; inList = true; }
          out += `<li>${inline(t.slice(2))}</li>`;
        } else {
          if (inList) { out += '</ul>'; inList = false; }
          out += `<p>${inline(t)}</p>`;
        }
      }
      if (inList) out += '</ul>';
      return out;
    }

    function renderPrdRead(p) {
      const prd = p.prd || {};
      const sections = [
        ['1. 문제 정의 & 타깃', prd.problem],
        ['2. 핵심 기능 & 흐름 (MVP)', prd.features],
        ['3. 수익 모델 & SaaS 구조', prd.business],
        ['4. 아키텍처 & 기술 선택 이유', prd.architecture],
        ['5. 트러블슈팅 & 핵심 설명 포인트', prd.notes]
      ];
      $('prdReadView').innerHTML = `
        <div class="prd-meta">
          <span>유형 <b>${esc(p.type)}</b></span>
          <span>상태 <b>${esc(p.status)}</b></span>
          ${p.target ? `<span>타깃 <b>${esc(p.target)}</b></span>` : ''}
          ${p.pricing ? `<span>수익모델 <b>${esc(p.pricing)}</b></span>` : ''}
        </div>
        ${sections.map(([title, body]) => `
          <div class="prd-section">
            <h3>${title}</h3>
            ${formatText(body)}
          </div>
        `).join('')}
      `;
    }

    function setPrdMode(edit) {
      isEditingPrd = edit;
      $('prdReadView').classList.toggle('hidden', edit);
      $('prdEditView').classList.toggle('hidden', !edit);
      $('btnSavePrd').classList.toggle('hidden', !edit);
      $('btnImportMd').classList.toggle('hidden', !edit);
      $('btnTogglePrdMode').textContent = edit ? '보기' : '수정';
    }

    function openPrd(id) {
      const p = projects.find(x => x.id === id);
      if (!p) return;
      activePrdId = id;
      $('prdTitle').textContent = p.title;
      const prd = p.prd || {};
      $('eProblem').value = prd.problem || '';
      $('eFeatures').value = prd.features || '';
      $('eBusiness').value = prd.business || '';
      $('eArchitecture').value = prd.architecture || '';
      $('eNotes').value = prd.notes || '';

      const gh = $('prdGithubLink');
      if (p.planUrl) { gh.href = p.planUrl; gh.classList.remove('hidden'); }
      else { gh.classList.add('hidden'); }

      renderPrdRead(p);
      setPrdMode(false);
      $('prdModal').classList.remove('hidden');
    }

    function closePrd() {
      $('prdModal').classList.add('hidden');
      activePrdId = null;
    }

    function buildMd(p) {
      const prd = p.prd || {};
      return [
        `# ${p.title}`,
        '',
        `> ${p.desc || ''}`,
        '',
        `- 유형: ${p.type}`,
        `- 상태: ${p.status}`,
        `- 타깃: ${p.target || '-'}`,
        `- 수익 모델: ${p.pricing || '-'}`,
        `- 기술 스택: ${(p.tags || []).join(', ') || '-'}`,
        '',
        '## 1. 문제 정의 & 타깃',
        prd.problem || '',
        '',
        '## 2. 핵심 기능 & 흐름 (MVP)',
        prd.features || '',
        '',
        '## 3. 수익 모델 & SaaS 구조',
        prd.business || '',
        '',
        '## 4. 아키텍처 & 기술 선택 이유',
        prd.architecture || '',
        '',
        '## 5. 트러블슈팅 & 핵심 설명 포인트',
        prd.notes || '',
        ''
      ].join('\n');
    }

    /* Project Add / Edit Modal */
    const form = $('projectForm');
    $('fType').innerHTML = TYPES.map(t => `<option value="${t}">${t}</option>`).join('');

    function openEdit(id = null) {
      form.reset();
      const p = id ? projects.find(x => x.id === id) : null;
      $('editTitle').textContent = p ? 'SaaS 수정' : 'SaaS 추가';
      $('btnDelete').classList.toggle('hidden', !p);
      form.id.value = p ? p.id : '';
      if (p) {
        form.title.value = p.title || '';
        form.type.value = TYPES.includes(p.type) ? p.type : TYPES[0];
        form.status.value = p.status || '기획중';
        form.desc.value = p.desc || '';
        form.target.value = p.target || '';
        form.pricing.value = p.pricing || '';
        form.tags.value = (p.tags || []).join(', ');
        form.live.value = p.live || '';
        form.repo.value = p.repo || '';
      } else {
        form.type.value = selectedType !== '전체' ? selectedType : TYPES[0];
      }
      $('editModal').classList.remove('hidden');
      $('fTitle').focus();
    }

    function closeEdit() {
      $('editModal').classList.add('hidden');
    }

    /* Events */
    $('typeFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-type]');
      if (!btn) return;
      selectedType = btn.dataset.type;
      render();
    });

    $('searchInput').addEventListener('input', renderGrid);
    $('btnAdd').addEventListener('click', () => openEdit(null));

    $('grid').addEventListener('click', (e) => {
      const prdBtn = e.target.closest('[data-open-prd]');
      if (prdBtn) { openPrd(prdBtn.dataset.openPrd); return; }
      const editBtn = e.target.closest('[data-edit]');
      if (editBtn) { openEdit(editBtn.dataset.edit); }
    });

    // PRD Modal Events
    $('btnClosePrd').addEventListener('click', closePrd);
    $('prdModal').addEventListener('click', (e) => { if (e.target === $('prdModal')) closePrd(); });
    $('btnTogglePrdMode').addEventListener('click', () => {
      const p = projects.find(x => x.id === activePrdId);
      if (isEditingPrd && p) renderPrdRead(p);
      setPrdMode(!isEditingPrd);
    });

    $('btnSavePrd').addEventListener('click', () => {
      const idx = projects.findIndex(x => x.id === activePrdId);
      if (idx === -1) return;
      projects[idx].prd = {
        problem: $('eProblem').value.trim(),
        features: $('eFeatures').value.trim(),
        business: $('eBusiness').value.trim(),
        architecture: $('eArchitecture').value.trim(),
        notes: $('eNotes').value.trim()
      };
      save();
      renderPrdRead(projects[idx]);
      setPrdMode(false);
      showToast('기획서를 저장했습니다.');
    });

    $('btnDownloadMd').addEventListener('click', () => {
      const p = projects.find(x => x.id === activePrdId);
      if (!p) return;
      const slug = (p.title || 'plan').toLowerCase().replace(/[^a-z0-9가-힣-]+/g, '-').slice(0, 40);
      const blob = new Blob([buildMd(p)], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${slug}-PLAN.md`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('.md 파일을 저장했습니다.');
    });

    $('btnImportMd').addEventListener('click', () => $('mdInput').click());
    $('mdInput').addEventListener('change', async (e) => {
      const f = e.target.files?.[0]; if (!f) return;
      const text = await f.text();
      const map = [
        ['eProblem', /^##\s*1\./m],
        ['eFeatures', /^##\s*2\./m],
        ['eBusiness', /^##\s*3\./m],
        ['eArchitecture', /^##\s*4\./m],
        ['eNotes', /^##\s*[567]\./m]
      ];
      const matches = [...text.matchAll(/^##\s+(.+)$/gm)];
      if (!matches.length) { $('eProblem').value = text.trim(); }
      else {
        let extraNotes = [];
        for (let i = 0; i < matches.length; i++) {
          const head = matches[i][0];
          const body = text.slice(matches[i].index + head.length, i + 1 < matches.length ? matches[i + 1].index : text.length).trim();
          const hit = map.find(([, re]) => re.test(head));
          if (hit && body) {
            if (hit[0] === 'eNotes') extraNotes.push(body);
            else $(hit[0]).value = body;
          }
        }
        if (extraNotes.length) $('eNotes').value = extraNotes.join('\n\n');
      }
      e.target.value = '';
      showToast('기획서를 불러왔습니다. 저장을 눌러 반영하세요.');
    });

    // Edit Modal Events
    $('btnCloseEdit').addEventListener('click', closeEdit);
    $('btnCancelEdit').addEventListener('click', closeEdit);
    $('editModal').addEventListener('click', (e) => { if (e.target === $('editModal')) closeEdit(); });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(form));
      if (!v.title.trim() || !v.desc.trim()) {
        showToast('프로젝트명과 한 줄 설명을 입력해 주세요.');
        return;
      }
      const tags = v.tags.split(',').map(s => s.trim()).filter(Boolean).slice(0, 6);
      if (v.id) {
        const idx = projects.findIndex(x => x.id === v.id);
        if (idx !== -1) {
          projects[idx] = {
            ...projects[idx],
            title: v.title.trim(), type: v.type, status: v.status,
            desc: v.desc.trim(), target: v.target.trim(), pricing: v.pricing.trim(),
            tags, live: v.live.trim(), repo: v.repo.trim()
          };
        }
        showToast('수정했습니다.');
      } else {
        projects.unshift({
          id: 'saas-' + Date.now().toString(36),
          title: v.title.trim(), type: v.type, status: v.status,
          desc: v.desc.trim(), target: v.target.trim(), pricing: v.pricing.trim(),
          tags, live: v.live.trim(), repo: v.repo.trim(), planUrl: '',
          prd: { problem: '', features: '', business: '', architecture: '', notes: '' }
        });
        showToast('추가했습니다.');
      }
      save(); render(); closeEdit();
    });

    $('btnDelete').addEventListener('click', () => {
      const id = form.id.value;
      const p = projects.find(x => x.id === id);
      if (p && confirm(`"${p.title}"을(를) 삭제할까요?`)) {
        projects = projects.filter(x => x.id !== id);
        save(); render(); closeEdit();
        showToast('삭제했습니다.');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeEdit(); closePrd(); }
    });

    load();
    render();
  </script>
</body>
</html>
