<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS</title>
  <meta name="description" content="SaaS 프로젝트와 기획서 정리" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --subtle: #f4f4f5;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --accent: #111827;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-count {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-subtle {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .link-subtle:hover { color: var(--text); background: var(--subtle); }

    /* Buttons */
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn:hover { background: var(--subtle); border-color: var(--border-strong); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover { background: #27272a; border-color: #27272a; }

    .btn-danger {
      color: #dc2626;
      border-color: #fecaca;
      background: #fff;
    }

    .btn-danger:hover { background: #fef2f2; }

    /* Level 1: Audience Tabs */
    .nav-block {
      margin: 20px 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s;
    }

    .tab:hover { color: var(--text); border-color: var(--border-strong); }

    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .tab-num {
      font-weight: 500;
      opacity: 0.65;
      margin-left: 3px;
      font-size: 12px;
    }

    .search {
      width: 220px;
      max-width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 13px;
      font-family: inherit;
    }

    .search:focus, .field:focus {
      outline: none;
      border-color: var(--accent);
    }

    .cat-desc {
      margin: 0;
      font-size: 12.5px;
      color: var(--muted);
    }

    /* Level 2: Domain Sub-chips */
    .subfilters {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 2px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s;
    }

    .chip:hover { color: var(--text); border-color: var(--border-strong); }

    .chip.active {
      background: var(--subtle);
      color: var(--text);
      border-color: var(--text);
      font-weight: 600;
    }

    /* Group Sections */
    .groups {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .group-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .group-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .group-sub {
      font-size: 12.5px;
      color: var(--muted);
    }

    .group-add {
      background: none;
      border: none;
      padding: 2px 6px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
    }

    .group-add:hover { color: var(--text); background: var(--subtle); }

    /* Grid & Card */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      transition: border-color 0.15s;
    }

    .card:hover { border-color: #9ca3af; }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .meta-badges {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .badge-cat {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      background: var(--subtle);
      padding: 2px 7px;
      border-radius: 5px;
    }

    .badge-domain {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 1px 7px;
      border-radius: 5px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      display: inline-block;
    }

    .dot-기획중 { background: #9ca3af; }
    .dot-개발중 { background: #f59e0b; }
    .dot-배포완료 { background: #10b981; }

    .card-title {
      margin: 2px 0 0;
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .card-desc {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 40px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      font-size: 11.5px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-links {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
    }

    .card-link {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }

    .card-link:hover { color: var(--text); text-decoration: underline; }

    .card-link-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    .card-link-btn:hover { text-decoration: underline; }

    .card-edit-btn {
      background: none;
      border: none;
      padding: 2px 4px;
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }

    .card-edit-btn:hover { color: var(--text); }

    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-size: 13.5px;
    }

    .empty button {
      margin-top: 12px;
    }

    /* Modal */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal {
      width: 100%;
      max-width: 720px;
      max-height: 88vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.14);
    }

    .modal-sm { max-width: 560px; }

    .modal-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .modal-head-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg);
    }

    /* PRD Reader */
    .prd-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 16px;
      padding: 12px 14px;
      background: var(--subtle);
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .prd-meta b { color: var(--text); font-weight: 600; margin-left: 4px; }

    .prd-section { margin-bottom: 18px; }
    .prd-section:last-child { margin-bottom: 0; }
    .prd-section h3 { margin: 0 0 6px; font-size: 13.5px; font-weight: 700; color: var(--text); }
    .prd-section p { margin: 4px 0; font-size: 13.5px; color: #374151; line-height: 1.65; }
    .prd-section ul { margin: 4px 0; padding-left: 18px; font-size: 13.5px; color: #374151; line-height: 1.65; }
    .prd-section li { margin: 2px 0; }
    .prd-section code { background: var(--subtle); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; font-family: Consolas, Monaco, monospace; }

    /* Form */
    .form-stack { display: flex; flex-direction: column; gap: 13px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: #374151; }
    .field {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 13.5px;
      font-family: inherit;
      line-height: 1.5;
    }

    textarea.field { resize: vertical; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      z-index: 100;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 580px) {
      .grid { grid-template-columns: 1fr; }
      .form-row, .form-row-3, .prd-meta { grid-template-columns: 1fr; }
      .search { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1>SaaS</h1>
        <span class="brand-count" id="totalCount"></span>
      </div>
      <div class="header-actions">
        <a href="https://github.com/jake12733/saas-archive" target="_blank" rel="noopener" class="link-subtle">GitHub</a>
        <a href="https://jake12733.github.io/acharive/" target="_blank" rel="noopener" class="link-subtle">Archive</a>
        <button type="button" class="btn btn-primary" id="btnAdd">+ 추가</button>
      </div>
    </header>

    <!-- 1차(고객 대상) + 2차(분야) 필터 -->
    <section class="nav-block" aria-label="분류 및 검색">
      <div class="top-bar">
        <div class="tabs" id="categoryTabs"></div>
        <input type="search" id="searchInput" class="search" placeholder="검색 (이름, 분야, 스택, 기획서)" />
      </div>
      <p class="cat-desc" id="categoryDesc"></p>
      <div class="subfilters" id="domainChips"></div>
    </section>

    <!-- Main Groups -->
    <main>
      <div class="groups" id="groups"></div>
      <div class="empty hidden" id="empty">
        <p style="margin:0;">이 분류에 등록된 SaaS가 아직 없습니다.</p>
        <button type="button" class="btn btn-primary" id="btnEmptyAdd">+ 이 분류에 SaaS 추가</button>
      </div>
    </main>
  </div>

  <!-- PRD Modal -->
  <div class="backdrop hidden" id="prdModal" role="dialog" aria-modal="true" aria-labelledby="prdTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="prdTitle">기획서</h2>
        <div class="modal-head-actions">
          <button type="button" class="btn" id="btnTogglePrdMode">수정</button>
          <button type="button" class="btn" id="btnDownloadMd">.md 저장</button>
          <button type="button" class="btn" id="btnClosePrd">닫기</button>
        </div>
      </div>

      <div class="modal-body">
        <div id="prdReadView"></div>

        <div id="prdEditView" class="form-stack hidden">
          <div>
            <label class="label" for="eProblem">1. 문제 정의 &amp; 타깃</label>
            <textarea id="eProblem" rows="3" class="field" placeholder="- 누구의 어떤 문제를 해결하는가?"></textarea>
          </div>
          <div>
            <label class="label" for="eFeatures">2. 핵심 기능 &amp; 흐름 (MVP)</label>
            <textarea id="eFeatures" rows="4" class="field" placeholder="- 핵심 기능과 사용자 흐름"></textarea>
          </div>
          <div>
            <label class="label" for="eBusiness">3. 수익 모델 &amp; SaaS 구조</label>
            <textarea id="eBusiness" rows="3" class="field" placeholder="- 과금, 멀티테넌시, 권한, 사용량 제한"></textarea>
          </div>
          <div>
            <label class="label" for="eArchitecture">4. 아키텍처 &amp; 기술 선택 이유</label>
            <textarea id="eArchitecture" rows="4" class="field" placeholder="- 주요 테이블, API 흐름, 기술 선택 이유(트레이드오프)"></textarea>
          </div>
          <div>
            <label class="label" for="eNotes">5. 트러블슈팅 &amp; 핵심 설명 포인트</label>
            <textarea id="eNotes" rows="4" class="field" placeholder="- 문제 → 해결 기록, 3분 설명 포인트"></textarea>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <div style="display:flex; gap:8px; align-items:center;">
          <a id="prdGithubLink" href="#" target="_blank" rel="noopener" class="card-link hidden">GitHub .md ↗</a>
          <button type="button" class="btn hidden" id="btnImportMd">.md 불러오기</button>
          <input type="file" id="mdInput" accept=".md,.txt" hidden />
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-primary hidden" id="btnSavePrd">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Project Modal -->
  <div class="backdrop hidden" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <form class="modal modal-sm" id="projectForm" novalidate>
      <div class="modal-head">
        <h2 id="editTitle">SaaS 추가</h2>
        <button type="button" class="btn" id="btnCloseEdit">닫기</button>
      </div>

      <div class="modal-body form-stack">
        <input type="hidden" name="id" />

        <div>
          <label class="label" for="fTitle">프로젝트명 *</label>
          <input id="fTitle" name="title" class="field" required placeholder="예) AI 마케팅 콘텐츠 자동화" />
        </div>

        <div class="form-row">
          <div>
            <label class="label" for="fCategory">1차 분류 (고객 대상)</label>
            <select id="fCategory" name="category" class="field"></select>
          </div>
          <div>
            <label class="label" for="fDomain">2차 분류 (분야)</label>
            <select id="fDomain" name="domain" class="field"></select>
          </div>
        </div>

        <div class="form-row-3">
          <div>
            <label class="label" for="fScope">시장 범위</label>
            <select id="fScope" name="scope" class="field">
              <option value="Micro-SaaS">Micro-SaaS</option>
              <option value="Vertical">Vertical</option>
              <option value="Horizontal">Horizontal</option>
            </select>
          </div>
          <div>
            <label class="label" for="fDelivery">제공 방식</label>
            <select id="fDelivery" name="delivery" class="field">
              <option value="Web App">Web App</option>
              <option value="API-first">API-first</option>
              <option value="Widget">Widget</option>
              <option value="Plugin / Extension">Plugin / Extension</option>
              <option value="White-label">White-label</option>
              <option value="Boilerplate / Starter">Boilerplate / Starter</option>
            </select>
          </div>
          <div>
            <label class="label" for="fStatus">상태</label>
            <select id="fStatus" name="status" class="field">
              <option value="기획중">기획중</option>
              <option value="개발중">개발중</option>
              <option value="배포완료">배포완료</option>
            </select>
          </div>
        </div>

        <div>
          <label class="label" for="fDesc">한 줄 설명 *</label>
          <textarea id="fDesc" name="desc" rows="2" class="field" required placeholder="무엇을 해결하는 서비스인지 한 문장으로 작성"></textarea>
        </div>

        <div class="form-row">
          <div>
            <label class="label" for="fPricing">과금 모델</label>
            <select id="fPricing" name="pricing" class="field">
              <option value="Freemium">Freemium</option>
              <option value="Tiered (등급제)">Tiered (등급제)</option>
              <option value="Per-seat (좌석 기반)">Per-seat (좌석 기반)</option>
              <option value="Usage-based (사용량)">Usage-based (사용량)</option>
              <option value="Hybrid (구독+사용량)">Hybrid (구독+사용량)</option>
              <option value="One-time (일회성 라이선스)">One-time (일회성 라이선스)</option>
              <option value="BYOAPI (무료/오픈)">BYOAPI (무료/오픈)</option>
            </select>
          </div>
          <div>
            <label class="label" for="fTags">기술 스택 (쉼표 구분)</label>
            <input id="fTags" name="tags" class="field" placeholder="Next.js, TypeScript, Supabase" />
          </div>
        </div>

        <div class="form-row">
          <div>
            <label class="label" for="fLive">데모 URL</label>
            <input id="fLive" name="live" type="url" class="field" placeholder="https://..." />
          </div>
          <div>
            <label class="label" for="fRepo">GitHub URL</label>
            <input id="fRepo" name="repo" type="url" class="field" placeholder="https://github.com/..." />
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn btn-danger hidden" id="btnDelete">삭제</button>

          notes: '- 향후 로그인·문서 클라우드 저장·사용량 과금을 붙이면 완전한 구독형 Prosumer SaaS로 전환 가능.'

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const getCatObj = (id) => CATEGORIES.find(c => c.id === id);

    let projects = [];
    let selectedCategory = '전체';
    let selectedDomain = '전체';
    let activePrdId = null;
    let isEditingPrd = false;
    let toastTimer = null;

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) { projects = parsed; return; }
        }
      } catch {}
      projects = structuredClone(DEFAULT_PROJECTS);
      save();
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); } catch {}
    }

    function showToast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2000);
    }

    function renderCategoryTabs() {
      const allTab = `<button type="button" class="tab ${selectedCategory === '전체' ? 'active' : ''}" data-cat="전체">전체<span class="tab-num">${projects.length}</span></button>`;
      const catTabs = CATEGORIES.map(c => {
        const count = projects.filter(p => p.category === c.id).length;
        return `<button type="button" class="tab ${selectedCategory === c.id ? 'active' : ''}" data-cat="${esc(c.id)}">${esc(c.id)}<span class="tab-num">${count}</span></button>`;
      }).join('');
      $('categoryTabs').innerHTML = allTab + catTabs;

      const catObj = getCatObj(selectedCategory);
      $('categoryDesc').textContent = catObj
        ? `${catObj.id} — ${catObj.desc}`
        : '고객 대상별(1차) → 분야별(2차)로 정리한 SaaS 프로젝트와 기획서 목록입니다.';
    }

    function renderDomainChips() {
      const catObj = getCatObj(selectedCategory);
      let domains;
      if (catObj) {
        const extra = [...new Set(projects.filter(p => p.category === catObj.id).map(p => p.domain).filter(Boolean))];
        domains = [...new Set([...catObj.domains, ...extra])];
      } else {
        domains = [...new Set(projects.map(p => p.domain).filter(Boolean))];
      }

      if (selectedDomain !== '전체' && !domains.includes(selectedDomain)) {
        selectedDomain = '전체';
      }

      const baseList = selectedCategory === '전체' ? projects : projects.filter(p => p.category === selectedCategory);
      $('domainChips').innerHTML = [
        `<button type="button" class="chip ${selectedDomain === '전체' ? 'active' : ''}" data-domain="전체">전체 분야</button>`,
        ...domains.map(d => {
          const n = baseList.filter(p => p.domain === d).length;
          return `<button type="button" class="chip ${selectedDomain === d ? 'active' : ''}" data-domain="${esc(d)}">${esc(d)}${n ? ` ${n}` : ''}</button>`;
        })
      ].join('');
    }

    function cardHtml(p) {
      return `
        <article class="card">
          <div class="card-meta">
            <div class="meta-badges">
              <span class="badge-cat">${esc(p.category)}</span>
              <span class="badge-domain">${esc(p.domain)}</span>
            </div>
            <span class="status"><span class="dot dot-${esc(p.status)}"></span>${esc(p.status)}</span>
          </div>
          <h2 class="card-title">${esc(p.title)}</h2>
          <p class="card-desc">${esc(p.desc)}</p>
          <div class="tags">
            ${(p.tags || []).slice(0, 4).map(t => `<span class="tag">${esc(t)}</span>`).join('')}

          <div class="card-footer">
            <div class="card-links">
              <button type="button" class="card-link-btn" data-open-prd="${esc(p.id)}">기획서</button>

              ${p.repo ? `<a class="card-link" href="${esc(p.repo)}" target="_blank" rel="noopener">GitHub ↗</a>` : ''}
            </div>
            <button type="button" class="card-edit-btn" data-edit="${esc(p.id)}">수정</button>
          </div>
        </article>`;
    }

    function renderGroups() {
      const q = $('searchInput').value.trim().toLowerCase();
      const filtered = projects.filter(p => {
        if (selectedCategory !== '전체' && p.category !== selectedCategory) return false;
        if (selectedDomain !== '전체' && p.domain !== selectedDomain) return false;
        if (q) {
          const hay = [p.title, p.category, p.domain, p.scope, p.delivery, p.pricing, p.status, p.desc, ...(p.tags || []), ...Object.values(p.prd || {})].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      $('totalCount').textContent = `${projects.length}개`;

      if (!filtered.length) {
        $('groups').innerHTML = '';
        $('empty').classList.remove('hidden');
        return;
      }

      $('empty').classList.add('hidden');

      if (selectedCategory === '전체') {
        // 1차 분류(고객 대상)별로 깔끔히 묶어서 표시
        const sections = CATEGORIES.map(cat => {
          const items = filtered.filter(p => p.category === cat.id);
          if (!items.length) return '';
          return `
            <section>
              <div class="group-head">
                <div class="group-title-wrap">
                  <h2 class="group-title">${esc(cat.id)}</h2>
                  <span class="group-sub">${esc(cat.desc)} · ${items.length}개</span>

              </div>
              <div class="grid">${items.map(cardHtml).join('')}</div>
            </section>`;
        }).filter(Boolean);
        $('groups').innerHTML = sections.join('');
      } else {
        // 선택된 1차 분류 안에서 2차 분야별로 묶어서 표시
        const domainOrder = [...new Set(filtered.map(p => p.domain))];
        const sections = domainOrder.map(dom => {
          const items = filtered.filter(p => p.domain === dom);
          return `
            <section>
              <div class="group-head">
                <div class="group-title-wrap">
                  <h2 class="group-title">${esc(dom)}</h2>
                  <span class="group-sub">${items.length}개</span>
                </div>
                <button type="button" class="group-add" data-quick-add="${esc(selectedCategory)}" data-quick-domain="${esc(dom)}">+ 추가</button>
              </div>
              <div class="grid">${items.map(cardHtml).join('')}</div>
            </section>`;
        });
        $('groups').innerHTML = sections.join('');
      }
    }

    function render() {
      renderCategoryTabs();
      renderDomainChips();
      renderGroups();

    /* PRD Modal */
    function formatText(text) {
      const raw = (text || '').trim();
      if (!raw) return '<p style="color:#9ca3af;">미작성</p>';
      const lines = esc(raw).split(/\r?\n/);
      const inline = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      let out = '', inList = false;
      for (const l of lines) {
        const t = l.trim();
        if (!t) { if (inList) { out += '</ul>'; inList = false; } continue; }
        if (t.startsWith('- ')) {
          if (!inList) { out += '<ul>'; inList = true; }
          out += `<li>${inline(t.slice(2))}</li>`;
        } else {
          if (inList) { out += '</ul>'; inList = false; }
          out += `<p>${inline(t)}</p>`;
        }
      }
      if (inList) out += '</ul>';
      return out;
    }

    function renderPrdRead(p) {
      const prd = p.prd || {};
      const sections = [
        ['1. 문제 정의 & 타깃', prd.problem],
        ['2. 핵심 기능 & 흐름 (MVP)', prd.features],
        ['3. 수익 모델 & SaaS 구조', prd.business],
        ['4. 아키텍처 & 기술 선택 이유', prd.architecture],
        ['5. 트러블슈팅 & 핵심 설명 포인트', prd.notes]
      ];
      $('prdReadView').innerHTML = `
        <div class="prd-meta">
          <span>고객 대상<b>${esc(p.category)}</b></span>
          <span>분야<b>${esc(p.domain)}</b></span>
          <span>시장 범위<b>${esc(p.scope || '-')}</b></span>
          <span>제공 방식<b>${esc(p.delivery || '-')}</b></span>
          <span>과금 모델<b>${esc(p.pricing || '-')}</b></span>
          <span>상태<b>${esc(p.status)}</b></span>
        </div>
        ${sections.map(([title, body]) => `
          <div class="prd-section">
            <h3>${title}</h3>
            ${formatText(body)}
          </div>`).join('')}
      `;

    }

    function openPrd(id) {
      const p = projects.find(x => x.id === id);

      activePrdId = id;

      $('eProblem').value = prd.problem || '';
      $('eFeatures').value = prd.features || '';
      $('eBusiness').value = prd.business || '';
      $('eArchitecture').value = prd.architecture || '';
      $('eNotes').value = prd.notes || '';

      const gh = $('prdGithubLink');

      else { gh.classList.add('hidden'); }

      renderPrdRead(p);
      setPrdMode(false);
      $('prdModal').classList.remove('hidden');
    }

    function closePrd() {
      $('prdModal').classList.add('hidden');
      activePrdId = null;
    }

    function buildMd(p) {
      const prd = p.prd || {};
      return [
        `# ${p.title}`,
        '',
        `> ${p.desc || ''}`,
        '',
        `- 고객 대상: ${p.category}`,
        `- 분야: ${p.domain}`,
        `- 시장 범위: ${p.scope || '-'}`,
        `- 제공 방식: ${p.delivery || '-'}`,
        `- 과금 모델: ${p.pricing || '-'}`,
        `- 상태: ${p.status}`,
        `- 기술 스택: ${(p.tags || []).join(', ') || '-'}`,
        '',
        '## 1. 문제 정의 & 타깃',
        prd.problem || '',
        '',
        '## 2. 핵심 기능 & 흐름 (MVP)',
        prd.features || '',
        '',
        '## 3. 수익 모델 & SaaS 구조',
        prd.business || '',
        '',
        '## 4. 아키텍처 & 기술 선택 이유',
        prd.architecture || '',
        '',
        '## 5. 트러블슈팅 & 핵심 설명 포인트',
        prd.notes || '',
        ''
      ].join('\n');
    }

    /* Project Add / Edit Modal */
    const form = $('projectForm');
    $('fCategory').innerHTML = CATEGORIES.map(c => `<option value="${esc(c.id)}">${esc(c.id)}</option>`).join('');

    function syncDomainSelect(catId, presetDomain = null) {
      const cat = getCatObj(catId) || CATEGORIES[0];
      const domains = [...cat.domains];
      if (presetDomain && !domains.includes(presetDomain)) domains.unshift(presetDomain);
      $('fDomain').innerHTML = domains.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
      if (presetDomain) $('fDomain').value = presetDomain;
    }

    $('fCategory').addEventListener('change', (e) => syncDomainSelect(e.target.value));

    function openEdit(id = null, presetCat = null, presetDomain = null) {
      form.reset();
      const p = id ? projects.find(x => x.id === id) : null;
      $('editTitle').textContent = p ? 'SaaS 수정' : 'SaaS 추가';
      $('btnDelete').classList.toggle('hidden', !p);
      form.id.value = p ? p.id : '';

      if (p) {
        form.title.value = p.title || '';
        form.category.value = getCatObj(p.category) ? p.category : CATEGORIES[0].id;
        syncDomainSelect(form.category.value, p.domain);
        form.scope.value = p.scope || 'Micro-SaaS';
        form.delivery.value = p.delivery || 'Web App';
        form.status.value = p.status || '기획중';
        form.desc.value = p.desc || '';
        form.pricing.value = p.pricing || 'Freemium';
        form.tags.value = (p.tags || []).join(', ');
        form.live.value = p.live || '';
        form.repo.value = p.repo || '';
      } else {
        const cat = presetCat || (selectedCategory !== '전체' ? selectedCategory : CATEGORIES[0].id);
        form.category.value = cat;
        syncDomainSelect(cat, presetDomain || (selectedDomain !== '전체' ? selectedDomain : null));
      }
      $('editModal').classList.remove('hidden');
      $('fTitle').focus();
    }

    function closeEdit() {
      $('editModal').classList.add('hidden');
    }

    $('categoryTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-cat]');
      if (!btn) return;
      selectedCategory = btn.dataset.cat;
      selectedDomain = '전체';
      render();
    });

    $('domainChips').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-domain]');
      if (!btn) return;
      selectedDomain = btn.dataset.domain;
      renderDomainChips();
      renderGroups();
    });

    $('searchInput').addEventListener('input', renderGroups);
    $('btnAdd').addEventListener('click', () => openEdit(null));
    $('btnEmptyAdd').addEventListener('click', () => openEdit(null));

    $('groups').addEventListener('click', (e) => {
      const prdBtn = e.target.closest('[data-open-prd]');
      if (prdBtn) { openPrd(prdBtn.dataset.openPrd); return; }
      const editBtn = e.target.closest('[data-edit]');
      if (editBtn) { openEdit(editBtn.dataset.edit); return; }
      const qAdd = e.target.closest('[data-quick-add]');
      if (qAdd) { openEdit(null, qAdd.dataset.quickAdd, qAdd.dataset.quickDomain || null); }
    });

    // PRD Modal Events
    $('btnClosePrd').addEventListener('click', closePrd);
    $('prdModal').addEventListener('click', (e) => { if (e.target === $('prdModal')) closePrd(); });
    $('btnTogglePrdMode').addEventListener('click', () => {
      const p = projects.find(x => x.id === activePrdId);
      if (isEditingPrd && p) renderPrdRead(p);
      setPrdMode(!isEditingPrd);
    });

    $('btnSavePrd').addEventListener('click', () => {
      const idx = projects.findIndex(x => x.id === activePrdId);
      if (idx === -1) return;
      projects[idx].prd = {
        problem: $('eProblem').value.trim(),
        features: $('eFeatures').value.trim(),
        business: $('eBusiness').value.trim(),
        architecture: $('eArchitecture').value.trim(),
        notes: $('eNotes').value.trim()
      };
      save();
      renderPrdRead(projects[idx]);
      setPrdMode(false);
      showToast('기획서를 저장했습니다.');
    });

    $('btnDownloadMd').addEventListener('click', () => {
      const p = projects.find(x => x.id === activePrdId);
      if (!p) return;
      const slug = (p.title || 'plan').toLowerCase().replace(/[^a-z0-9가-힣-]+/g, '-').slice(0, 40);
      const blob = new Blob([buildMd(p)], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${slug}-PLAN.md`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('.md 파일을 저장했습니다.');
    });

    $('btnImportMd').addEventListener('click', () => $('mdInput').click());
    $('mdInput').addEventListener('change', async (e) => {
      const f = e.target.files?.[0]; if (!f) return;
      const text = await f.text();
      const map = [
        ['eProblem', /^##\s*1\./m],
        ['eFeatures', /^##\s*2\./m],
        ['eBusiness', /^##\s*3\./m],
        ['eArchitecture', /^##\s*4\./m],
        ['eNotes', /^##\s*[567]\./m]
      ];
      const matches = [...text.matchAll(/^##\s+(.+)$/gm)];
      if (!matches.length) { $('eProblem').value = text.trim(); }
      else {
        let extra = [];
        for (let i = 0; i < matches.length; i++) {
          const head = matches[i][0];
          const body = text.slice(matches[i].index + head.length, i + 1 < matches.length ? matches[i + 1].index : text.length).trim();
          const hit = map.find(([, re]) => re.test(head));
          if (hit && body) {
            if (hit[0] === 'eNotes') extra.push(body);
            else $(hit[0]).value = body;
          }
        }
        if (extra.length) $('eNotes').value = extra.join('\n\n');
      }
      e.target.value = '';
      showToast('기획서를 불러왔습니다. 저장을 눌러 반영하세요.');
    });

    // Edit Modal Events
    $('btnCloseEdit').addEventListener('click', closeEdit);
    $('btnCancelEdit').addEventListener('click', closeEdit);
    $('editModal').addEventListener('click', (e) => { if (e.target === $('editModal')) closeEdit(); });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(form));
      if (!v.title.trim() || !v.desc.trim()) {
        showToast('프로젝트명과 한 줄 설명을 입력해 주세요.');
        return;
      }
      const tags = v.tags.split(',').map(s => s.trim()).filter(Boolean).slice(0, 6);
      if (v.id) {
        const idx = projects.findIndex(x => x.id === v.id);
        if (idx !== -1) {
          projects[idx] = {
            ...projects[idx],
            title: v.title.trim(), category: v.category, domain: v.domain,
            scope: v.scope, delivery: v.delivery, pricing: v.pricing, status: v.status,
            desc: v.desc.trim(), tags, live: v.live.trim(), repo: v.repo.trim()
          };
        }
        showToast('수정했습니다.');
      } else {
        projects.unshift({
          id: 'saas-' + Date.now().toString(36),
          title: v.title.trim(), category: v.category, domain: v.domain,
          scope: v.scope, delivery: v.delivery, pricing: v.pricing, status: v.status,
          desc: v.desc.trim(), tags, live: v.live.trim(), repo: v.repo.trim(), planUrl: '',
          prd: { problem: '', features: '', business: '', architecture: '', notes: '' }
        });
        showToast('추가했습니다.');
      }
      save(); render(); closeEdit();
    });

    $('btnDelete').addEventListener('click', () => {
      const id = form.id.value;
      const p = projects.find(x => x.id === id);
      if (p && confirm(`"${p.title}"을(를) 삭제할까요?`)) {
        projects = projects.filter(x => x.id !== id);
        save(); render(); closeEdit();
        showToast('삭제했습니다.');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeEdit(); closePrd(); }
    });

    load();
    render();
  </script>
</body>
</html>
